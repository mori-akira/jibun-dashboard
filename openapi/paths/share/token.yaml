get:
  operationId: getShareInfo
  summary: 共有リンク情報取得
  description: トークンを指定して、共有リンクの共有対象種別と有効期限を取得する
  tags:
    - Share
  security: []
  parameters:
    - in: path
      name: token
      description: トークン
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: 正常時
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/SharedLinkBase"
          example:
            $ref: "../../examples/share/get.json"
    "404":
      $ref: "../../openapi.yaml#/components/responses/NotFound"
    "410":
      $ref: "../../openapi.yaml#/components/responses/Gone"
